name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.COCOGITTO_APP_ID }}
          private-key: ${{ secrets.COCOGITTO_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Cocogitto Bump + Changelog + Tag
        id: cog
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"

      - name: Push version bump commit + tag в main
        if: steps.cog.outputs.version != ''
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub Release via Cocogitto
        if: steps.cog.outputs.version != ''
        uses: cocogitto/cocogitto-action@v4
        with:
          command: release
